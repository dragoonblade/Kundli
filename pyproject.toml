[project]
name = "kundli"
version = "1.0.0"
description = "Vedic Birth Chart (Kundli) Generator"
requires-python = ">=3.10"
dependencies = [
    "pyswisseph==2.10.3.2",
    "geopy==2.4.1",
    "Flask==3.1.3",
    "gunicorn==23.0.0",
]

[project.scripts]
kundli = "kundli.app:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
