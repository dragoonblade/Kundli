<script>
function setView(view) {
    trackEvent('view_toggle', {view: view});
    document.querySelectorAll('div[data-view]').forEach(function(el) {
        el.style.display = el.getAttribute('data-view').split(' ').includes(view) ? '' : 'none';
    });
    // Show/hide nav links per view
    document.querySelectorAll('.section-nav a[data-view]').forEach(function(el) {
        el.style.display = el.getAttribute('data-view').split(' ').includes(view) ? '' : 'none';
    });
    document.getElementById('btn-horoscope').classList.toggle('active', view === 'horoscope');
    document.getElementById('btn-study').classList.toggle('active', view === 'study');
    document.getElementById('btn-full').classList.toggle('active', view === 'full');
    localStorage.setItem('kundli-view', view);
}
var savedView = localStorage.getItem('kundli-view') || 'horoscope';
setView(savedView);

function setLang(lang) {
    trackEvent('lang_toggle', {lang: lang});
    document.querySelectorAll('.t').forEach(el => {
        const val = el.getAttribute('data-' + (lang === 'hindu' ? 'h' : 'e'));
        if (val !== null) el.textContent = val;
    });
    document.getElementById('btn-hindu').classList.toggle('active', lang === 'hindu');
    document.getElementById('btn-english').classList.toggle('active', lang === 'english');
    localStorage.setItem('kundli-lang', lang);
}

function setMode(mode) {
    document.querySelectorAll('.gen-only').forEach(el => el.style.display = mode === 'general' ? '' : 'none');
    document.querySelectorAll('.adv-only').forEach(el => el.style.display = mode === 'advanced' ? '' : 'none');
    var gn = document.getElementById('dasha-note-general');
    var an = document.getElementById('dasha-note-advanced');
    if (gn) gn.style.display = mode === 'general' ? '' : 'none';
    if (an) an.style.display = mode === 'advanced' ? '' : 'none';
    document.getElementById('btn-general').classList.toggle('active', mode === 'general');
    document.getElementById('btn-advanced').classList.toggle('active', mode === 'advanced');
    localStorage.setItem('kundli-mode', mode);
}

// Restore preferences
var savedLang = localStorage.getItem('kundli-lang');
if (savedLang) setLang(savedLang);
var savedMode = localStorage.getItem('kundli-mode') || 'general';
setMode(savedMode);

// Restore chat history
var chatHistory = JSON.parse(localStorage.getItem('kundli-chat') || '[]');
chatHistory.forEach(function(m) { addMsg(m.text, m.cls, false); });

// Render markdown bold in life area sections
document.querySelectorAll('.la-section p, .la-item').forEach(function(el) {
    el.innerHTML = el.innerHTML.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
});

function toggleChat() {
    var w = document.getElementById('chat-widget');
    var t = document.getElementById('chat-toggle');
    if (w.style.display === 'none') { w.style.display = 'flex'; t.style.display = 'none'; }
    else { w.style.display = 'none'; t.style.display = 'flex'; }
}

function addMsg(text, cls, save) {
    var div = document.createElement('div');
    div.className = 'chat-msg ' + cls;
    div.innerHTML = text.replace(/\n/g, '<br>')
                         .replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>')
                         .replace(/\*([\s\S]*?)\*/g, '<em>$1</em>');
    var msgs = document.getElementById('chat-messages');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    if (save !== false) {
        var history = JSON.parse(localStorage.getItem('kundli-chat') || '[]');
        history.push({text: text, cls: cls});
        localStorage.setItem('kundli-chat', JSON.stringify(history.slice(-50)));
    }
}

function sendChat() {
    var input = document.getElementById('chat-input');
    var q = input.value.trim();
    if (!q) return;
    trackEvent('chat_message', {question: q.substring(0, 50)});
    input.value = '';
    addMsg(q, 'user');
    addMsg('Thinking..', 'bot typing');

    fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q})
    })
    .then(r => r.json())
    .then(data => {
        var msgs = document.getElementById('chat-messages');
        msgs.removeChild(msgs.lastChild);
        addMsg(data.answer, 'bot');
    })
    .catch(() => {
        var msgs = document.getElementById('chat-messages');
        msgs.removeChild(msgs.lastChild);
        addMsg('Sorry, something went wrong. Please try again.', 'bot');
    });
}

function askSuggestion(btn) {
    var map = {
        '📊 Chart summary': 'Give me an overall summary of my chart',
        '💼 Career': 'What does my chart say about my career?',
        '💑 Marriage': 'Tell me about my marriage and relationships',
        '🔮 Current dasha': 'What is my current dasha period and what does it mean?',
        '💪 Strengths': 'What are the strengths in my chart?',
        '⚠️ Challenges': 'What challenges does my chart show?'
    };
    document.getElementById('chat-input').value = map[btn.textContent] || btn.textContent;
    sendChat();
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');

// Back-to-top visibility
const btt = document.getElementById('btt');
window.addEventListener('scroll', function() {
    btt.classList.toggle('visible', window.scrollY > 400);
});

// Section nav scroll-spy
const navLinks = document.querySelectorAll('.section-nav a');
const sections = Array.from(navLinks).map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
const navBar = document.getElementById('section-nav');
function updateNav() {
    let current = '';
    const offset = navBar ? navBar.offsetHeight + 80 : 80;
    for (const sec of sections) {
        if (sec.getBoundingClientRect().top <= offset && sec.offsetParent !== null) current = sec.id;
    }
    navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
}
window.addEventListener('scroll', updateNav);
updateNav();

// Loading spinner on form submit
document.querySelectorAll('form').forEach(function(f) {
    f.addEventListener('submit', function() {
        var btn = f.querySelector('button[type="submit"]');
        if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; btn.style.opacity = '0.7'; }
    });
});

// Export North Indian chart as PNG
function exportChartPNG() {
    var svg = document.querySelector('#sec-charts .chart-svg');
    var svgData = new XMLSerializer().serializeToString(svg);
    var canvas = document.createElement('canvas');
    canvas.width = 720; canvas.height = 720;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0c0c11';
    ctx.fillRect(0, 0, 720, 720);
    var img = new Image();
    img.onload = function() {
        ctx.drawImage(img, 0, 0, 720, 720);
        var a = document.createElement('a');
        a.download = 'kundli-chart.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(
        svgData.replace(/var\(--border\)/g, '#252535')
               .replace(/var\(--accent\)/g, '#e8a020')
               .replace(/var\(--planet\)/g, '#6aacf0')
               .replace(/var\(--text-secondary\)/g, '#a8a8bc')
               .replace(/var\(--bg\)/g, '#0c0c11')
    )));
}

function toggleTheme() { trackEvent("theme_toggle");
    document.documentElement.classList.toggle('light');
    localStorage.setItem('kundli-theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
}
if(localStorage.getItem('kundli-theme') === 'light') document.documentElement.classList.add('light');

// IndexedDB for offline chart storage
function openDB() {
    return new Promise(function(resolve, reject) {
        var req = indexedDB.open('kundli-charts', 1);
        req.onupgradeneeded = function(e) { e.target.result.createObjectStore('charts', {keyPath: 'id'}); };
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { reject(); };
    });
}
function saveChartLocally() {
    var shareUrl = '{{ share_url|safe }}';
    var data = {
        id: shareUrl,
        url: window.location.origin + shareUrl,
        date: new Date().toISOString(),
        label: '{{ birth_dt.strftime("%d %b %Y") }}, {{ location }}'
    };
    openDB().then(function(db) {
        var tx = db.transaction('charts', 'readwrite');
        tx.objectStore('charts').put(data);
        tx.oncomplete = function() {
            var btn = document.querySelector('[onclick="saveChartLocally()"]');
            if (btn) btn.textContent = '✓ Saved!';
        };
    });
}
</script>
