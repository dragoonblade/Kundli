<section class="card" id="sec-charts">
    <h2>Birth Charts</h2>
    <div class="charts-row">
        <div class="chart-box">
            <h3>North Indian</h3>
            <svg viewBox="0 0 360 360" class="chart-svg" role="img" aria-label="North Indian birth chart diagram">
                <rect x="5" y="5" width="350" height="350" fill="none" stroke="var(--border)" stroke-width="1.5" rx="4"/>
                <line x1="5" y1="5" x2="180" y2="180" stroke="var(--border)" stroke-width="1"/>
                <line x1="355" y1="5" x2="180" y2="180" stroke="var(--border)" stroke-width="1"/>
                <line x1="5" y1="355" x2="180" y2="180" stroke="var(--border)" stroke-width="1"/>
                <line x1="355" y1="355" x2="180" y2="180" stroke="var(--border)" stroke-width="1"/>
                <line x1="180" y1="5" x2="180" y2="355" stroke="var(--border)" stroke-width="1"/>
                <line x1="5" y1="180" x2="355" y2="180" stroke="var(--border)" stroke-width="1"/>
                {% set positions = {
                    1:  (180, 55),
                    2:  (280, 55),
                    3:  (320, 135),
                    4:  (320, 225),
                    5:  (280, 305),
                    6:  (180, 305),
                    7:  (80, 305),
                    8:  (40, 225),
                    9:  (40, 135),
                    10: (80, 55),
                    11: (30, 30),
                    12: (135, 110)
                } %}
                {% for h in range(1,13) %}
                {% set x, y = positions[h] %}
                <text x="{{ x }}" y="{{ y - 2 }}" class="chart-house-num" font-size="7" fill="var(--text-secondary)" text-anchor="middle">{{ h }}</text>
                <text x="{{ x }}" y="{{ y + 10 }}" class="chart-sign t" data-h="{{ chart[h].sign_h }}" data-e="{{ chart[h].sign_e }}" font-size="10" text-anchor="middle" fill="var(--accent)">{{ chart[h].sign_h }}</text>
                <text x="{{ x }}" y="{{ y + 22 }}" class="chart-planets t" data-h="{{ chart[h].planets_h }}" data-e="{{ chart[h].planets_e }}" font-size="9" text-anchor="middle" fill="var(--planet)">{{ chart[h].planets_h }}</text>
                {% endfor %}
                <text x="180" y="183" font-size="8" fill="var(--text-secondary)" text-anchor="middle" font-style="italic">Asc</text>
            </svg>
        </div>
        <div class="chart-box">
            <h3>South Indian</h3>
            {{ south_indian_chart(planets, planet_names, sign_names) }}
        </div>
    </div>
    <div style="text-align:center;margin-top:var(--space-sm)">
        <button class="btn-share" onclick="exportChartPNG()">📷 Save Chart as PNG</button>
    </div>
</section>
