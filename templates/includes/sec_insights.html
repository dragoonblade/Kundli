{% if daily_insights %}
<section class="card" id="sec-insights">
    <h2>Today's Insights</h2>
    <div class="insights-grid">
        {% for ins in daily_insights %}
        <div class="insight-item">
            <span class="planet-name"><span class="t" data-h="{{ ins.planet }}" data-e="{{ planet_names[ins.planet] }}">{{ ins.planet }}</span></span>
            <span class="insight-text">{{ ins.text }}</span>
        </div>
        {% endfor %}
    </div>
</section>
{% endif %}
