<!-- Chat Widget -->
<div id="chat-toggle" onclick="toggleChat()">💬</div>
<div id="chat-widget" style="display:none">
    <div class="chat-header">
        <span>🕉 Ask about your chart</span>
        <button onclick="toggleChat()" class="chat-close">✕</button>
    </div>
    <div id="chat-messages">
        <div class="chat-msg bot">Hi! I can answer questions about your birth chart. Try asking about your career, marriage, health, current dasha, or anything else! 🙏</div>
    </div>
    <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="e.g. Tell me about my career.." onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">→</button>
    </div>
    <div class="chat-suggestions">
        <button onclick="askSuggestion(this)">📊 Chart summary</button>
        <button onclick="askSuggestion(this)">💼 Career</button>
        <button onclick="askSuggestion(this)">💑 Marriage</button>
        <button onclick="askSuggestion(this)">🔮 Current dasha</button>
        <button onclick="askSuggestion(this)">💪 Strengths</button>
        <button onclick="askSuggestion(this)">⚠️ Challenges</button>
    </div>
</div>
